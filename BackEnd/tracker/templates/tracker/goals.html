<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Goals | BudgetWise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-blue: #4d6ef6; --bg-light: #f4f7fe; --text-gray: #8e92a4; }
        body { background-color: var(--bg-light); font-family: 'Segoe UI', sans-serif; }
        .sidebar { width: 260px; background: white; height: 100vh; position: sticky; top: 0; border-right: 1px solid #eef0f7; padding: 40px 20px; }
        .nav-link { color: var(--text-gray); padding: 12px 20px; border-radius: 12px; text-decoration: none; display: block; margin-bottom: 5px; }
        .nav-link.active { background: #f0f3ff; color: var(--main-blue); font-weight: 600; }
        .main-content { flex-grow: 1; padding: 40px; max-width: 1000px; }
        .goal-card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .stat-box { border-radius: 15px; padding: 15px; text-align: center; background: white; }
        .progress { height: 10px; border-radius: 10px; margin: 15px 0; }
        .create-btn { background: #00ab6b; color: white; border-radius: 12px; padding: 8px 20px; text-decoration: none; font-weight: bold; }
        .goal-icon { width: 50px; height: 50px; background: #f8f9fe; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-right: 15px; }
    </style>
</head>
<body>
<div class="d-flex">
    <nav class="sidebar">
        <div class="text-center mb-5">
            <div id="userAvatar" style="width: 60px; height: 60px; background: var(--main-blue); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; margin: 0 auto 15px;">?</div>
            <h6 class="fw-bold mb-0" id="userName">User</h6>
        </div>
        <div class="nav flex-column">
            <a href="home.html" class="nav-link"><i class="fas fa-home me-2"></i> Home</a>
            <a href="transactions.html" class="nav-link"><i class="fas fa-exchange-alt me-2"></i> Trans.</a>
            <a href="budgets.html" class="nav-link"><i class="fas fa-chart-pie me-2"></i> Budgets</a>
            <a href="goals.html" class="nav-link active"><i class="fas fa-bullseye me-2"></i> Goals</a>
            <a href="reports.html" class="nav-link"><i class="fas fa-chart-line me-2"></i> Reports</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Financial Goals</h2>
            <a href="create-goal.html" class="create-btn">+ Add Goal</a>
        </div>

        <div class="row g-3 mb-4 text-center">
            <div class="col-4"><div class="stat-box shadow-sm"><small class="text-success fw-bold">Active Goals</small><h4 id="activeGoalsCount" class="mb-0">0</h4></div></div>
            <div class="col-4"><div class="stat-box shadow-sm"><small class="text-primary fw-bold">Total Saved</small><h4 id="totalSaved" class="mb-0">$0</h4></div></div>
            <div class="col-4"><div class="stat-box shadow-sm"><small class="text-warning fw-bold">Target</small><h4 id="totalTarget" class="mb-0">$0</h4></div></div>
        </div>

        <div id="goalsList"></div>
    </main>
</div>

<script>
window.onload = function() {
    const session = JSON.parse(localStorage.getItem("userAccount"));
    if(!session) { window.location.href="login.html"; return; }
    
    document.getElementById("userName").innerText = session.name;
    document.getElementById("userAvatar").innerText = session.name.charAt(0).toUpperCase();

    const allUsers = JSON.parse(localStorage.getItem("allUsers")) || [];
    const user = allUsers.find(u => u.email === session.email);
    const goals = user.goals || [];

    renderGoals(goals);
};

function renderGoals(goals) {
    const container = document.getElementById("goalsList");
    let savedTotal = 0, targetTotal = 0;
    container.innerHTML = goals.length === 0 ? '<p class="text-center text-muted">No goals yet. Start saving!</p>' : '';

    goals.forEach(g => {
        const percent = Math.min((g.current / g.target) * 100, 100);
        savedTotal += Number(g.current);
        targetTotal += Number(g.target);
        
        container.innerHTML += `
            <div class="goal-card shadow-sm">
                <div class="d-flex align-items-center mb-2">
                    <div class="goal-icon">${g.icon || '🎯'}</div>
                    <div class="flex-grow-1">
                        <h6 class="fw-bold mb-0">${g.name}</h6>
                        <small class="text-muted">Target: $${Number(g.target).toLocaleString()} • Deadline: ${g.deadline}</small>
                    </div>
                </div>
                <div class="progress"><div class="progress-bar bg-success" style="width: ${percent}%"></div></div>
                <div class="d-flex justify-content-between small fw-bold">
                    <span class="text-success">${percent.toFixed(0)}% - $${Number(g.current).toLocaleString()} saved</span>
                    <span class="text-muted">$${Math.max(0, g.target - g.current).toLocaleString()} left</span>
                </div>
            </div>`;
    });
    
    document.getElementById("activeGoalsCount").innerText = goals.length;
    document.getElementById("totalSaved").innerText = "$" + savedTotal.toLocaleString();
    document.getElementById("totalTarget").innerText = "$" + targetTotal.toLocaleString();
}
</script>
</body>
</html>
