<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | BudgetWise</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      :root {
        --main-blue: #4d6ef6;
        --bg-light: #f4f7fe;
      }
      body {
        background-color: var(--bg-light);
        font-family: "Segoe UI", sans-serif;
      }
      .sidebar {
        min-width: 260px;
        background: white;
        height: 100vh;
        position: sticky;
        top: 0;
        border-right: 1px solid #eef0f7;
        padding: 40px 20px;
      }
      .nav-link {
        color: #8e92a4;
        padding: 12px 20px;
        border-radius: 12px;
        text-decoration: none;
        display: block;
        margin-bottom: 5px;
      }
      .nav-link.active {
        background: #f0f3ff;
        color: var(--main-blue);
        font-weight: 600;
      }
      .stat-card {
        border: none;
        border-radius: 20px;
        padding: 25px;
        transition: 0.3s;
      }
      .stat-card:hover {
        transform: translateY(-5px);
      }
      .trans-item {
        background: white;
        padding: 15px;
        border-radius: 15px;
        margin-bottom: 12px;
        border: 1px solid #f0f0f0;
      }
    </style>
  </head>
  <body>
    <div class="d-flex">
      <nav class="sidebar">
        <div class="text-center mb-5">
          <div
            id="userAvatar"
            style="
              width: 60px;
              height: 60px;
              background: var(--main-blue);
              color: white;
              border-radius: 50%;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 1.5rem;
              font-weight: bold;
              margin: 0 auto 15px;
            "
          >
            ?
          </div>
          <h6 class="fw-bold mb-0" id="userName">User Name</h6>
        </div>
        <div class="nav flex-column">
          <a href="home.html" class="nav-link active"
            ><i class="fas fa-home me-2"></i> Home</a
          >
          <a href="transactions.html" class="nav-link"
            ><i class="fas fa-exchange-alt me-2"></i> Trans.</a
          >
          <a href="budgets.html" class="nav-link "
            ><i class="fas fa-chart-pie"></i> Budgets</a
          >
          <a href="goals.html" class="nav-link"
            ><i class="fas fa-bullseye"></i> Goals</a
          >
          <a href="reports.html" class="nav-link"
            ><i class="fas fa-chart-line"></i> reports</a
          >
          <a
            href="add-transaction.html"
            class="btn btn-primary mt-4 rounded-pill"
            >Add New</a
          >
        </div>
      </nav>

      <main class="flex-grow-1 p-5">
        <div class="d-flex justify-content-between align-items-center mb-5">
          <h3 class="fw-bold">Financial Overview</h3>
          <button class="btn btn-outline-danger btn-sm" id="logoutBtn">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>

        <div class="row g-4 mb-5">
          <div class="col-md-4">
            <div class="stat-card shadow-sm bg-white text-center">
              <p class="text-muted small fw-bold mb-1">TOTAL BALANCE</p>
              <h2 class="fw-bold text-primary" id="totalBalance">$0.00</h2>
            </div>
          </div>
          <div class="col-md-4">
            <div class="stat-card shadow-sm bg-success text-white text-center">
              <p class="small fw-bold mb-1">TOTAL INCOME</p>
              <h2 class="fw-bold" id="totalIncome">$0.00</h2>
            </div>
          </div>
          <div class="col-md-4">
            <div class="stat-card shadow-sm bg-danger text-white text-center">
              <p class="small fw-bold mb-1">TOTAL EXPENSES</p>
              <h2 class="fw-bold" id="totalExpenses">$0.00</h2>
            </div>
          </div>
        </div>

        <h5 class="fw-bold mb-4">Recent Transactions</h5>
        <div id="recentTransactionsList">
        </div>
      </main>
    </div>

    <script>
      class DashboardApp {
        constructor() {
          this._session = JSON.parse(localStorage.getItem("userAccount"));
          if (!this._session) {
            window.location.href = "login.html";
            return;
          }

          const allUsers = JSON.parse(localStorage.getItem("allUsers")) || [];
          this._user = allUsers.find((u) => u.email === this._session.email);

          this._initUI();
          this._initEvents();
        }

        _initUI() {
          document.getElementById("userName").innerText = this._session.name;
          document.getElementById("userAvatar").innerText = this._session.name
            .charAt(0)
            .toUpperCase();

          if (this._user) {
            const transactions = this._user.transactions || [];
            this._renderStats(transactions);
            this._renderRecentTransactions(transactions);
          }
        }

        _renderStats(transactions) {
          let income = 0, expenses = 0;
          transactions.forEach((t) => {
            if (t.type === "income")  income   += Number(t.amount);
            else if (t.type !== "saving") expenses += Number(t.amount);
          });

          const balance = income - expenses;
          document.getElementById("totalIncome").innerText   = `$${income.toFixed(2)}`;
          document.getElementById("totalExpenses").innerText = `$${expenses.toFixed(2)}`;
          document.getElementById("totalBalance").innerText  = `$${balance.toFixed(2)}`;
        }

        _renderRecentTransactions(transactions) {
          const container = document.getElementById("recentTransactionsList");
          const recent    = transactions.slice(-4).reverse();

          if (recent.length === 0) {
            container.innerHTML = `<p class="text-muted">No transactions recorded yet.</p>`;
            return;
          }

          container.innerHTML = recent.map((t) => `
            <div class="trans-item d-flex align-items-center justify-content-between">
              <div class="d-flex align-items-center">
                <div class="rounded-circle bg-light p-3 me-3">
                  ${t.type === "income" ? "💰" : t.type === "saving" ? "💾" : "💸"}
                </div>
                <div>
                  <h6 class="mb-0 fw-bold">${t.description}</h6>
                  <small class="text-muted">${t.category} • ${new Date(t.date).toLocaleDateString()}</small>
                </div>
              </div>
              <div class="${t.type === "income" ? "text-success" : "text-danger"} fw-bold">
                ${t.type === "income" ? "+" : "-"}$${Number(t.amount).toFixed(2)}
              </div>
            </div>
          `).join("");
        }

        logout() {
          localStorage.removeItem("userAccount");
          window.location.href = "login.html";
        }

        _initEvents() {
          const logoutBtn = document.getElementById("logoutBtn");
          if (logoutBtn) logoutBtn.addEventListener("click", () => this.logout());
        }
      }

      const app = new DashboardApp();
    </script>
  </body>
</html>
