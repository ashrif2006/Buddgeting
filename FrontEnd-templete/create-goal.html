<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Goal | BudgetWise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --main-blue: #4d6ef6; --bg-light: #f4f7fe; }
        body { background-color: var(--bg-light); font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 25px; max-width: 500px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .icon-box { width: 80px; height: 80px; background: rgba(0,171,107,0.1); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 15px; cursor: pointer; border: 2px dashed #00ab6b; }
        .form-label { font-weight: bold; font-size: 0.75rem; color: #8e92a4; text-uppercase: true; }
        .form-control { background: #f8f9fe; border: none; padding: 12px; border-radius: 12px; }
        .btn-create { background: #00ab6b; border: none; padding: 15px; border-radius: 15px; font-weight: bold; color: white; transition: 0.3s; }
        .btn-create:hover { background: #008a56; transform: translateY(-2px); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card p-4 p-md-5">
        <div class="text-center mb-4">
            <h3 class="fw-bold">Create Goal</h3>
        </div>

        <div class="text-center mb-4">
            <div class="icon-box" id="emojiPickerBtn"><span id="goalEmoji">🎯</span></div>
            <p class="small text-success">Choose goal icon</p>
        </div>

        <form id="goalForm">
            <div class="mb-3">
                <label class="form-label">GOAL NAME</label>
                <input type="text" id="goalName" class="form-control" placeholder="e.g. Vacation Fund" required>
            </div>
            <div class="mb-3">
                <label class="form-label">TARGET AMOUNT</label>
                <input type="number" id="goalTarget" class="form-control" placeholder="$5,000" required>
            </div>
            <div class="mb-3">
                <label class="form-label">INITIAL SAVINGS (OPTIONAL)</label>
                <input type="number" id="goalInitial" class="form-control" placeholder="How much already saved?">
            </div>
            <div class="mb-4">
                <label class="form-label">DEADLINE</label>
                <input type="date" id="goalDeadline" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-create w-100">Create Goal</button>
            <div class="text-center mt-3"><a href="goals.html" class="text-decoration-none text-muted small">Cancel</a></div>
        </form>
    </div>

<script>
  class CreateGoalApp {
    constructor() {
      this._session = JSON.parse(localStorage.getItem("userAccount"));
      if (!this._session) { window.location.href = "login.html"; return; }

      this._emojis = ["🎯", "🚗", "🏠", "💻", "✈️", "💍", "🎓"];
      this._initEvents();
    }

    _cycleEmoji() {
      const el      = document.getElementById("goalEmoji");
      const current = el.innerText;
      const nextIdx = (this._emojis.indexOf(current) + 1) % this._emojis.length;
      el.innerText  = this._emojis[nextIdx];
    }

    _saveGoal(name, target, initial, deadline, icon) {
      let allUsers  = JSON.parse(localStorage.getItem("allUsers")) || [];
      const userIdx = allUsers.findIndex((u) => u.email === this._session.email);
      if (userIdx === -1) return;

      if (!allUsers[userIdx].goals) allUsers[userIdx].goals = [];

      const newGoal = {
        id:       Date.now(),
        name,
        target,
        current:  initial,
        deadline,
        icon,
      };

      allUsers[userIdx].goals.push(newGoal);
      localStorage.setItem("allUsers", JSON.stringify(allUsers));
      window.location.href = "goals.html";
    }

    _initEvents() {
      document.getElementById("emojiPickerBtn")
        .addEventListener("click", () => this._cycleEmoji());

      document.getElementById("goalForm")
        .addEventListener("submit", (e) => {
          e.preventDefault();
          const name     = document.getElementById("goalName").value.trim();
          const target   = parseFloat(document.getElementById("goalTarget").value);
          const initial  = parseFloat(document.getElementById("goalInitial").value) || 0;
          const deadline = document.getElementById("goalDeadline").value;
          const icon     = document.getElementById("goalEmoji").innerText;

          if (!name || isNaN(target) || target <= 0 || !deadline) {
            return alert("Please fill all required fields with valid values.");
          }

          this._saveGoal(name, target, initial, deadline, icon);
        });
    }
  }

  new CreateGoalApp();
</script>
</body>
</html>
