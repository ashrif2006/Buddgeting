<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Login | BudgetWise</title>
  </head>
  <body>
    <div class="auth-container">
      <div class="card">
        <h2>Welcome Back</h2>
        <form id="loginForm">
          <div class="field">
            <label>Email Address</label>
            <input
              type="email"
              id="loginEmail"
              placeholder="Enter your email"
            />
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="loginPass" placeholder="********" />
          </div>
          <button type="submit" class="btn">Login</button>
        </form>
        <p class="switch-page">
          New user? <a href="signup.html">Create an account</a>
        </p>
      </div>
    </div>
    <script>
      class LoginApp {
        constructor() {
          this._allUsers = JSON.parse(localStorage.getItem("allUsers")) || [];
          this._initEvents();
        }

        // ── Data Methods ──────────────────────────────────────────
        _findUser(email, password) {
          return this._allUsers.find(
            (u) => u.email === email && u.password === password
          );
        }

        _createSession(user) {
          localStorage.setItem(
            "userAccount",
            JSON.stringify({ name: user.name, email: user.email })
          );
        }

        // ── UI Methods ────────────────────────────────────────────
        _showError(message) {
          alert(message);
        }

        // ── Event Initialization ──────────────────────────────────
        _initEvents() {
          document
            .getElementById("loginForm")
            .addEventListener("submit", (e) => this._handleSubmit(e));
        }

        _handleSubmit(e) {
          e.preventDefault();
          const email    = document.getElementById("loginEmail").value.trim();
          const password = document.getElementById("loginPass").value;
          const user     = this._findUser(email, password);

          if (user) {
            this._createSession(user);
            window.location.href = "./home.html";
          } else {
            this._showError("Invalid email or password!");
          }
        }
      }

      // Bootstrap
      new LoginApp();
    </script>
  </body>
</html>
