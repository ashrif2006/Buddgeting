<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>إنشاء حساب | BudgetWise</title>
  </head>
  <body>
    <div class="auth-container">
      <div class="card">
        <h2>إنشاء حساب جديد</h2>
        <form id="signupForm">
          <div class="field">
            <label>الاسم الكامل</label>
            <input type="text" id="fullName" placeholder="أدخل اسمك الثلاثي" />
            <span class="error-msg" id="nameError"></span>
          </div>
          <div class="field">
            <label>البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="example@mail.com" />
            <span class="error-msg" id="emailError"></span>
          </div>
          <div class="field">
            <label>كلمة المرور</label>
            <input type="password" id="password" placeholder="********" />
            <span class="error-msg" id="passError"></span>
          </div>
          <button type="submit" class="btn">تسجيل</button>
        </form>
        <p class="switch-page">
          لديك حساب بالفعل؟ <a href="login.html">سجل دخولك هنا</a>
        </p>
      </div>
    </div>
    <script>
      document
        .getElementById("signupForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const name = document.getElementById("fullName").value;
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          // 1. جلب المستخدمين الحاليين أو إنشاء مصفوفة فارغة
          let allUsers = JSON.parse(localStorage.getItem("allUsers")) || [];

          // 2. التأكد إن الإيميل مش موجود قبل كده
          if (allUsers.find((u) => u.email === email)) {
            return alert("This email is already registered!");
          }

          // 3. إنشاء كائن المستخدم الجديد بالهيكل اللي اتفقنا عليه
          const newUser = {
            name: name,
            email: email,
            password: password,
            transactions: [], // مصفوفة العمليات الخاصة به
            budgets: [], // مصفوفة الميزانيات الخاصة به
          };

          allUsers.push(newUser);
          localStorage.setItem("allUsers", JSON.stringify(allUsers));

          alert("Account created successfully!");
          window.location.href = "login.html";
        });
    </script>
  </body>
</html>
