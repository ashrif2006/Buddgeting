<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>إنشاء حساب | BudgetWise</title>
  </head>
  <body>
    <div class="auth-container">
      <div class="card">
        <h2>إنشاء حساب جديد</h2>
        <form id="signupForm">
          <div class="field">
            <label>الاسم الكامل</label>
            <input type="text" id="fullName" placeholder="أدخل اسمك الثلاثي" />
            <span class="error-msg" id="nameError"></span>
          </div>
          <div class="field">
            <label>البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="example@mail.com" />
            <span class="error-msg" id="emailError"></span>
          </div>
          <div class="field">
            <label>كلمة المرور</label>
            <input type="password" id="password" placeholder="********" />
            <span class="error-msg" id="passError"></span>
          </div>
          <button type="submit" class="btn">تسجيل</button>
        </form>
        <p class="switch-page">
          لديك حساب بالفعل؟ <a href="login.html">سجل دخولك هنا</a>
        </p>
      </div>
    </div>
    <script>
      class SignupApp {
        constructor() {
          this._allUsers = JSON.parse(localStorage.getItem("allUsers")) || [];
          this._initEvents();
        }

        _isEmailTaken(email) {
          return this._allUsers.some((u) => u.email === email);
        }

        _createUser(name, email, password) {
          const newUser = {
            name,
            email,
            password,
            transactions: [],
            budgets: [],
            goals: [],
          };
          this._allUsers.push(newUser);
          localStorage.setItem("allUsers", JSON.stringify(this._allUsers));
        }

        _showError(elementId, message) {
          const el = document.getElementById(elementId);
          if (el) el.innerText = message;
        }

        _clearErrors() {
          ["nameError", "emailError", "passError"].forEach((id) =>
            this._showError(id, "")
          );
        }

        _initEvents() {
          document
            .getElementById("signupForm")
            .addEventListener("submit", (e) => this._handleSubmit(e));
        }

        _handleSubmit(e) {
          e.preventDefault();
          this._clearErrors();

          const name     = document.getElementById("fullName").value.trim();
          const email    = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;

          if (!name) return this._showError("nameError", "Name is required.");
          if (!email) return this._showError("emailError", "Email is required.");
          if (this._isEmailTaken(email))
            return this._showError("emailError", "This email is already registered!");
          if (password.length < 6)
            return this._showError("passError", "Password must be at least 6 characters.");

          this._createUser(name, email, password);
          alert("Account created successfully!");
          window.location.href = "login.html";
        }
      }

      new SignupApp();
    </script>
  </body>
</html>
