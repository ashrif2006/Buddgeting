<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Budgets | BudgetWise</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <style>
      :root {
        --main-blue: #4d6ef6;
        --bg-light: #f4f7fe;
        --text-gray: #8e92a4;
      }

      body {
        background-color: var(--bg-light);
        font-family: "Segoe UI", sans-serif;
        margin: 0;
      }

      .sidebar {
        width: 260px;
        background: white;
        height: 100vh;
        position: sticky;
        top: 0;
        border-right: 1px solid #eef0f7;
        padding: 40px 20px;
      }

      .avatar {
        width: 60px;
        height: 60px;
        background: var(--main-blue);
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        font-weight: bold;
        margin: 0 auto 15px;
      }

      .nav-link {
        color: var(--text-gray);
        padding: 12px 20px;
        border-radius: 12px;
        display: block;
        text-decoration: none;
        margin-bottom: 5px;
      }

      .nav-link.active,
      .nav-link:hover {
        background: #f0f3ff;
        color: var(--main-blue) !important;
      }

      .main-content {
        flex-grow: 1;
        padding: 40px;
        max-width: 1000px;
      }

      .total-budget-card {
        background: linear-gradient(135deg, var(--main-blue), #708bff);
        border-radius: 24px;
        color: white;
        padding: 30px;
      }

      .category-item {
        background: white;
        border-radius: 18px;
        padding: 15px 20px;
        margin-bottom: 12px;
      }

      .cat-icon {
        width: 45px;
        height: 45px;
        background: #f8f9fe;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        margin-right: 15px;
      }

      .create-btn {
        background-color: var(--main-blue);
        color: white;
        border-radius: 12px;
        padding: 8px 20px;
        text-decoration: none;
      }

      .progress {
        height: 8px;
        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <div class="d-flex">
      <nav class="sidebar">
        <div class="text-center mb-5">
          <div class="avatar" id="userAvatar">?</div>
          <h6 class="fw-bold mb-0" id="userNameDisplay">User</h6>
        </div>

        <div>
          <a href="home.html" class="nav-link"
            ><i class="fas fa-home me-2"></i> Home</a
          >
          <a href="transactions.html" class="nav-link"
            ><i class="fas fa-exchange-alt me-2"></i> Trans.</a
          >
          <a href="budgets.html" class="nav-link active"
            ><i class="fas fa-chart-pie me-2"></i> Budgets</a
          >
          <a href="goals.html" class="nav-link"
            ><i class="fas fa-bullseye me-2"></i> Goals</a
          >
          <a href="reports.html" class="nav-link"
            ><i class="fas fa-chart-line me-2"></i> Reports</a
          >
        </div>
      </nav>

      <main class="main-content">
        <div class="d-flex justify-content-between mb-4">
          <h2 class="fw-bold">Budgets</h2>
          <a href="create-budget.html" class="create-btn">+ Create</a>
        </div>

        <div class="total-budget-card mb-4">
          <h1 id="totalBudget">$0.00</h1>

          <div class="d-flex justify-content-between">
            <small>Spent: <span id="totalSpent">$0.00</span></small>
            <small>Remaining: <span id="remaining">$0.00</span></small>
          </div>

          <div class="progress mt-2">
            <div class="progress-bar" id="totalProgress"></div>
          </div>
        </div>

        <div id="budgetList"></div>
      </main>
    </div>

    <script>
      class BudgetsApp {
        constructor() {
          this._session = JSON.parse(localStorage.getItem("userAccount"));
          if (!this._session || !this._session.email) {
            window.location.href = "login.html";
            return;
          }

          const allUsers = JSON.parse(localStorage.getItem("allUsers")) || [];
          this._user = allUsers.find((u) => u.email === this._session.email);

          if (!this._user) {
            localStorage.removeItem("userAccount");
            window.location.href = "login.html";
            return;
          }

          this._initUI();
        }

        _calculateSpent(budgets, transactions) {
          budgets.forEach((budget) => {
            budget.spent = transactions.reduce((sum, t) => {
              if (t.category === budget.category && t.type === "expense") {
                return sum + Number(t.amount);
              }
              return sum;
            }, 0);
          });
        }

        _initUI() {
          document.getElementById("userNameDisplay").innerText = this._session.name;
          document.getElementById("userAvatar").innerText =
            this._session.name ? this._session.name.charAt(0).toUpperCase() : "?";

          const budgets      = this._user.budgets      || [];
          const transactions = this._user.transactions || [];

          this._calculateSpent(budgets, transactions);
          this._renderBudgets(budgets);
          this._renderSummary(budgets);
        }

        _renderBudgets(budgets) {
          const container = document.getElementById("budgetList");

          if (budgets.length === 0) {
            container.innerHTML = `<p class="text-muted">No budgets yet. <a href="create-budget.html">Create one!</a></p>`;
            return;
          }

          container.innerHTML = budgets.map((b) => {
            const percent = b.amount > 0 ? (b.spent / b.amount) * 100 : 0;
            const isOver  = b.spent > b.amount;
            let color     = "#4d6ef6";
            if (isOver)          color = "#c62828";
            else if (percent > 80) color = "#ff5a5f";
            else if (percent > 50) color = "#f39c12";

            return `
              <div class="category-item d-flex align-items-center">
                <div class="cat-icon">${b.icon || "💰"}</div>
                <div class="flex-grow-1">
                  <div class="d-flex justify-content-between align-items-center">
                    <div>
                      <span>${b.category}</span>
                      ${isOver ? `<span class="badge bg-danger ms-2">Over Budget!</span>` : ""}
                    </div>
                    <span>$${b.spent.toFixed(2)} / $${Number(b.amount).toFixed(2)}</span>
                  </div>
                  <div class="progress">
                    <div class="progress-bar" style="width:${Math.min(percent,100)}%; background:${color};"></div>
                  </div>
                </div>
              </div>`;
          }).join("");
        }

        _renderSummary(budgets) {
          let totalBudget = 0, totalSpent = 0;
          budgets.forEach((b) => {
            totalBudget += Number(b.amount);
            totalSpent  += Number(b.spent);
          });

          const remaining = totalBudget - totalSpent;
          const percent   = totalBudget ? (totalSpent / totalBudget) * 100 : 0;

          document.getElementById("totalBudget").innerText  = `$${totalBudget.toFixed(2)}`;
          document.getElementById("totalSpent").innerText   = `$${totalSpent.toFixed(2)}`;
          document.getElementById("remaining").innerText    = `$${remaining.toFixed(2)}`;
          document.getElementById("totalProgress").style.width = `${Math.min(percent, 100)}%`;
        }
      }

      new BudgetsApp();
    </script>
  </body>
</html>
