<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budgets | BudgetWise</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --main-blue: #4d6ef6;
            --bg-light: #f4f7fe;
            --text-gray: #8e92a4;
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }

        .sidebar {
            width: 260px;
            background: white;
            height: 100vh;
            position: sticky;
            top: 0;
            border-right: 1px solid #eef0f7;
            padding: 40px 20px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            background: var(--main-blue);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0 auto 15px;
        }

        .nav-link {
            color: var(--text-gray);
            padding: 12px 20px;
            border-radius: 12px;
            display: block;
            text-decoration: none;
            margin-bottom: 5px;
        }

        .nav-link.active,
        .nav-link:hover {
            background: #f0f3ff;
            color: var(--main-blue) !important;
        }

        .main-content {
            flex-grow: 1;
            padding: 40px;
            max-width: 1000px;
        }

        .total-budget-card {
            background: linear-gradient(135deg, var(--main-blue), #708bff);
            border-radius: 24px;
            color: white;
            padding: 30px;
        }

        .category-item {
            background: white;
            border-radius: 18px;
            padding: 15px 20px;
            margin-bottom: 12px;
        }

        .cat-icon {
            width: 45px;
            height: 45px;
            background: #f8f9fe;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-right: 15px;
        }

        .create-btn {
            background-color: var(--main-blue);
            color: white;
            border-radius: 12px;
            padding: 8px 20px;
            text-decoration: none;
        }

        .progress {
            height: 8px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="text-center mb-5">
            <div class="avatar" id="userAvatar">?</div>
            <h6 class="fw-bold mb-0" id="userNameDisplay">User</h6>
        </div>

        <div>
            <a href="home.html" class="nav-link">Home</a>
            <a href="transactions.html" class="nav-link">Trans.</a>
            <a href="budgets.html" class="nav-link active">Budgets</a>
        </div>
    </nav>

    <!-- Main -->
    <main class="main-content">

        <div class="d-flex justify-content-between mb-4">
            <h2 class="fw-bold">Budgets</h2>
            <a href="create-budget.html" class="create-btn">+ Create</a>
        </div>

        <!-- Summary -->
        <div class="total-budget-card mb-4">
            <h1 id="totalBudget">$0.00</h1>

            <div class="d-flex justify-content-between">
                <small>Spent: <span id="totalSpent">$0.00</span></small>
                <small>Remaining: <span id="remaining">$0.00</span></small>
            </div>

            <div class="progress mt-2">
                <div class="progress-bar" id="totalProgress"></div>
            </div>
        </div>

        <!-- Budgets -->
        <div id="budgetList"></div>

    </main>
</div>

<script>
window.onload = function () {

    const session = JSON.parse(localStorage.getItem("userAccount"));

    if (!session || !session.email) {
        window.location.href = "login.html";
        return;
    }

    document.getElementById("userNameDisplay").innerText = session.name;
    document.getElementById("userAvatar").innerText =
        session.name ? session.name.charAt(0).toUpperCase() : "?";

    const allUsers = JSON.parse(localStorage.getItem("allUsers")) || [];
    const user = allUsers.find(u => u.email === session.email);

    if (!user) {
        localStorage.removeItem("userAccount");
        window.location.href = "login.html";
        return;
    }

    const budgets = user.budgets || [];
    const transactions = user.transactions || [];

    updateSpent(budgets, transactions);
    renderBudgets(budgets);
    calculateSummary(budgets);
};


function updateSpent(budgets, transactions) {

    budgets.forEach(budget => {
        budget.spent = 0;

        transactions.forEach(t => {
            if (t.category === budget.category && t.type === "expense") {
                budget.spent += Number(t.amount);
            }
        });
    });
}


function renderBudgets(budgets) {

    const container = document.getElementById("budgetList");
    container.innerHTML = "";

    if (budgets.length === 0) {
        container.innerHTML = `<p>No budgets yet.</p>`;
        return;
    }

    let html = "";

    budgets.forEach(b => {

        const percent = Math.min((b.spent / b.amount) * 100, 100);

        let color = "#4d6ef6";
        if (percent > 80) color = "#ff5a5f";
        else if (percent > 50) color = "#f39c12";

        html += `
        <div class="category-item d-flex align-items-center">

            <div class="cat-icon">${b.icon || "💰"}</div>

            <div class="flex-grow-1">
                <div class="d-flex justify-content-between">
                    <span>${b.category}</span>
                    <span>$${b.spent.toFixed(2)} / $${b.amount.toFixed(2)}</span>
                </div>

                <div class="progress">
                    <div class="progress-bar"
                        style="width:${percent}%; background:${color};">
                    </div>
                </div>
            </div>

        </div>
        `;
    });

    container.innerHTML = html;
}


function calculateSummary(budgets) {

    let totalBudget = 0;
    let totalSpent = 0;

    budgets.forEach(b => {
        totalBudget += Number(b.amount);
        totalSpent += Number(b.spent);
    });

    const remaining = totalBudget - totalSpent;
    const percent = totalBudget ? (totalSpent / totalBudget) * 100 : 0;

    document.getElementById("totalBudget").innerText =
        "$" + totalBudget.toFixed(2);

    document.getElementById("totalSpent").innerText =
        "$" + totalSpent.toFixed(2);

    document.getElementById("remaining").innerText =
        "$" + remaining.toFixed(2);

    document.getElementById("totalProgress").style.width =
        percent + "%";
}
</script>

</body>
</html>
